<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR สถานที่ท่องเที่ยวกรุงเทพ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@600;800&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--ink:#2a1a14;--mut:#6b5a50;--card:#fffaf0;--gold:#b8860b;--red:#9e1b1b;--line:#d9ccb4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1210;--ink:#f3e9d6;--mut:#b9a995;--card:#271b17;--gold:#e0b04a;--red:#ff7a63;--line:#4a3a30}}
:root[data-theme="dark"]{--bg:#1a1210;--ink:#f3e9d6;--mut:#b9a995;--card:#271b17;--gold:#e0b04a;--red:#ff7a63;--line:#4a3a30}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,"Noto Sans Thai",sans-serif;line-height:1.7}
header{padding:20px 20px 8px;max-width:1100px;margin:auto}
h1{font-family:"Noto Serif Thai",serif;font-weight:800;font-size:clamp(24px,4vw,38px);margin:0;line-height:1.3}
header p{margin:4px 0 0;color:var(--mut)}
.bar{max-width:1100px;margin:12px auto;padding:0 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid var(--gold);background:var(--gold);color:#1a1210;padding:8px 16px;border-radius:999px;font-weight:600}
button.ghost{background:transparent;color:var(--ink)}
button:focus-visible,.pin:focus-visible{outline:3px solid var(--red);outline-offset:3px}
#msg{color:var(--mut);font-size:14px}
.wrap{max-width:1100px;margin:auto;padding:0 20px;overflow-x:auto}
.stage{position:relative;min-width:760px;aspect-ratio:1366/768;border-radius:14px;overflow:hidden;background:#000}
.stage img,.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage video{display:none}
.stage.cam video{display:block}.stage.cam img{opacity:.0}
#layer{position:absolute;inset:0;transition:transform .1s linear}
.pin{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.dot{width:26px;height:26px;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:p 2.2s infinite}
.tag{background:rgba(20,12,10,.82);color:#fff;font-size:13px;padding:3px 10px;border-radius:8px;white-space:nowrap}
.pin[aria-pressed=true] .dot{background:var(--red)}
@keyframes p{70%{box-shadow:0 0 0 16px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}#layer{transition:none}}
#info{max-width:1100px;margin:18px auto 40px;padding:0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.card h2{font-family:"Noto Serif Thai",serif;margin:0;font-size:24px}
.card .en{color:var(--gold);font-weight:600;margin:0 0 8px}
.card p{margin:6px 0}
.tip{border-left:4px solid var(--gold);padding-left:12px;color:var(--mut)}

.stage.cam{position:fixed;inset:0;z-index:50;min-width:0;width:100vw;height:100dvh;aspect-ratio:auto;border-radius:0;touch-action:none}
.cam .pin{pointer-events:none}
#hud{display:none;position:absolute;inset:0;pointer-events:none;color:#fff;--c:#e0b04a}
.cam #hud{display:block}
#x{pointer-events:auto;position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:40px;height:40px;padding:0;background:rgba(0,0,0,.55);color:#fff;border-color:rgba(255,255,255,.4)}
#hint{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:14px;right:64px;font-size:14px;line-height:1.4;text-shadow:0 1px 4px #000}
#reticle{position:absolute;left:50%;top:45%;width:120px;height:120px;transform:translate(-50%,-50%);transition:width .5s,height .5s;animation:br 2.2s ease-in-out infinite}
#reticle i{position:absolute;width:24px;height:24px;border:3px solid #fff;transition:border-color .3s}
#reticle i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
#reticle i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
#reticle i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
#reticle i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
#reticle b{position:absolute;inset:0;border-radius:50%;border:2px solid var(--c);opacity:0}
.lock #reticle{width:210px;height:210px;animation:none}
.lock #reticle i{border-color:var(--c)}
.lock #reticle b{animation:rp 1.6s ease-out infinite}
.lock #reticle b+b{animation-delay:.8s}
@keyframes br{50%{transform:translate(-50%,-50%) scale(1.08)}}
@keyframes rp{from{transform:scale(.4);opacity:.9}to{transform:scale(1.9);opacity:0}}
#found{position:absolute;left:50%;top:max(70px,calc(45% - 165px));transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .3s;width:90%}
.lock #found{opacity:1}
#fn{display:inline-block;font-family:"Noto Serif Thai",serif;font-weight:800;font-size:22px;background:rgba(20,12,10,.82);padding:4px 16px;border-radius:12px;border-bottom:3px solid var(--c)}
.lock #fn{animation:rv .7s ease-out}
@keyframes rv{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
#fe{display:block;font-size:13px;margin-top:4px;text-shadow:0 1px 4px #000}
#sp{position:absolute;left:50%;top:45%}
#sp s{position:absolute;width:9px;height:9px;margin:-4px;border-radius:50%;background:var(--c);opacity:0}
.lock #sp s{animation:sp 1.2s ease-out}
@keyframes sp{0%{opacity:1;transform:rotate(var(--a)) translateX(30px)}100%{opacity:0;transform:rotate(var(--a)) translateX(160px) scale(.3)}}
#sheet{position:absolute;left:0;right:0;bottom:0;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);pointer-events:auto}
.lock #sheet{transform:none}
#sheet .card{max-height:40dvh;overflow:auto;padding:14px 16px}
#sheet .card h2{font-size:20px}
#sheet a{color:var(--gold);font-weight:600}
@media (prefers-reduced-motion:reduce){#reticle,#reticle b,#sp s,#fn{animation:none!important}#sheet{transition:none}}
.pic{display:none;height:min(32vh,230px);border-radius:999px 999px 14px 14px;border:3px solid var(--pc,#fff);background-size:cover;background-position:center;box-shadow:0 0 20px var(--pc),0 6px 18px rgba(0,0,0,.5);animation:pop .6s cubic-bezier(.2,1.4,.4,1) backwards,fl 3.4s ease-in-out .6s infinite;transition:scale .4s,box-shadow .4s}
.cam .pic{display:block}.cam .dot{display:none}
.pin.on .pic{scale:1.22;box-shadow:0 0 46px var(--pc),0 6px 18px rgba(0,0,0,.5)}
@keyframes pop{from{opacity:0;transform:scale(.3) translateY(40px)}}
@keyframes fl{50%{transform:translateY(-9px)}}
@media (prefers-reduced-motion:reduce){.pic{animation:none}}
.rot{pointer-events:auto;position:absolute;top:45%;width:54px;height:54px;margin-top:-27px;padding:0;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border-color:rgba(255,255,255,.45);font-size:22px;touch-action:none;user-select:none}
#md{pointer-events:auto;position:absolute;left:14px;top:calc(env(safe-area-inset-top,0px) + 64px);padding:4px 12px;font-size:13px;background:rgba(0,0,0,.55);color:#fff;border-color:rgba(255,255,255,.45)}
#tl{left:10px}#tr{right:10px}
</style></head><body>
<header><h1>เที่ยวกรุงเทพแบบ AR</h1><p>แตะจุดบนภาพเพื่อดูข้อมูล หรือเปิดกล้องแล้วหันไปทางสถานที่ ระบบจะจับภาพพร้อมแอนิเมชัน</p></header>

function tilt(al,be,ga){const x=(be||0)*R,y=(ga||0)*R,z=(al||0)*R;const vx=-Math.cos(z)*Math.sin(y)-Math.sin(z)*Math.sin(x)*Math.cos(y),vy=-Math.sin(z)*Math.sin(y)+Math.cos(z)*Math.sin(x)*Math.cos(y);let h=Math.atan(vx/vy);if(vy<0)h+=Math.PI;else if(vx<0)h+=2*Math.PI;return h/R}
function onO(e){let h=null;if(e.webkitCompassHeading!=null)h=e.webkitCompassHeading;else if(e.absolute&&e.alpha!=null)h=tilt(e.alpha,e.beta,e.gamma);if(h==null)return;th=h;if(!sensor){sensor=true;calib();head=(th+off)%360;mode()}}
function mode(){const m=document.getElementById('md');m.hidden=!(real&&sensor);m.textContent=live()?'โหมดจริง · แตะเพื่อดูแบบสาธิต':'โหมดสาธิต · แตะเพื่อใช้ทิศจริง';base=live()?'หันกล้องไปทางสถานที่ แล้วค้างไว้ให้กรอบจับภาพ':sensor?'โหมดสาธิต: หมุนตัวหรือเอียงมือถือรอบๆ (หรือลากบนจอ) เพื่อดูแต่ละที่':'โหมดสาธิต: ลากบนจอ หรือกดปุ่ม ◀ ▶ เพื่อหมุนมุมมอง'}
function lockOn(i){const p=P[i];lk=i;dw=0;S.style.setProperty('--c',p.c);FN.textContent='พบแล้ว · '+p.n;FE.textContent=p.e;
const km=live()?' · ห่างราว '+dist(pos.lat,pos.lng,p.lat,p.lng).toFixed(1)+' กม.':'';
SH.innerHTML='<div class="card"><h2>'+p.n+'</h2><p class="en">'+p.e+'</p><p>'+p.d+'</p><p class="tip">เคล็ดลับ: '+p.t+'</p><p><a href="https://www.google.com/maps/dir/?api=1&destination='+p.lat+','+p.lng+'" target="_blank" rel="noopener">นำทางไปที่นี่</a>'+km+'</p></div>';
show(i);S.classList.add('lock');pins[i].classList.add('on');H.textContent='';navigator.vibrate&&navigator.vibrate(40)}
function unlock(){S.classList.remove('lock');pins.forEach(b=>b.classList.remove('on'));lk=null;dw=0}
function tick(){if(!stream)return;if(sensor)head=(head+dlt((th+off)%360,head)*.2+360)%360;
const FOV=innerWidth<innerHeight?52:70;let bi=0,bd=999;
P.forEach((p,i)=>{const d=dlt(brg(i),head),el=pins[i],v=Math.abs(d)<FOV/2+6;el.style.display=v?'':'none';if(v){el.style.left=50+d/FOV*100+'%';el.style.top='45%'}if(Math.abs(d)<Math.abs(bd)){bd=d;bi=i}});
if(lk==null){if(Math.abs(bd)<7){if(++dw>14)lockOn(bi)}else dw=0}
else if(Math.abs(dlt(brg(lk),head))>13)unlock();
if(lk==null)H.textContent='[v4] '+base+' · '+(Math.abs(bd)<7?'กำลังจับภาพ…':'ใกล้สุด: '+P[bi].n+(bd<0?' ◀ ซ้าย':' ขวา ▶'));
requestAnimationFrame(tick)}
function stop(){stream&&stream.getTracks().forEach(t=>t.stop());stream=null;unlock();S.classList.remove('cam');document.body.style.overflow='';C.textContent='เปิดกล้อง AR';M.textContent='';P.forEach((p,i)=>{pins[i].style.display='';pins[i].style.left=p.x+'%';pins[i].style.top=p.y+'%'})}
C.onclick=async()=>{if(stream)return stop();
let ok=false;try{ok=typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission?(await DeviceOrientationEvent.requestPermission())==='granted':true}catch(e){}
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}
catch(e){M.textContent=!window.isSecureContext?'ต้องเปิดผ่าน https:// เท่านั้น (GitHub Pages ใช้ได้)':e.name==='NotAllowedError'?'ยังไม่ได้อนุญาตกล้อง กดไอคอนตั้งค่าข้างช่องที่อยู่เว็บแล้วเลือกอนุญาต':e.name==='NotFoundError'?'ไม่พบกล้องในอุปกรณ์นี้':'เปิดกล้องไม่ได้: '+e.name;return}
V.srcObject=stream;S.classList.add('cam');document.body.style.overflow='hidden';C.textContent='ปิดกล้อง';
sensor=false;real=false;demoF=false;off=0;pos=DEMO;mode();
if(ok&&!listening){listening=true;addEventListener('deviceorientationabsolute',onO,true);addEventListener('deviceorientation',onO,true)}
navigator.geolocation&&navigator.geolocation.getCurrentPosition(g=>{const a=g.coords.latitude,b=g.coords.longitude;if(Math.min(...P.map(p=>dist(a,b,p.lat,p.lng)))<3){pos={lat:a,lng:b};real=true;calib();mode()}},()=>{},{enableHighAccuracy:true,timeout:8000});
tick()};
X.onclick=stop;
document.getElementById('md').onclick=()=>{demoF=!demoF;calib();head=(th+off)%360;unlock();mode()};
function turn(g){if(sensor)off=(off+g+360)%360;else head=(head+g+360)%360}
const DPP=()=>(innerWidth<innerHeight?52:70)/innerWidth;
S.addEventListener('pointerdown',e=>{if(stream&&!e.target.closest('#sheet,button')){drag=e.clientX;try{S.setPointerCapture(e.pointerId)}catch(_){}}});
S.addEventListener('pointermove',e=>{if(drag!=null){turn(-(e.clientX-drag)*DPP());drag=e.clientX}});
['pointerup','pointercancel'].forEach(n=>S.addEventListener(n,()=>{drag=null}));
S.addEventListener('wheel',e=>{if(stream)turn(e.deltaY/20)},{passive:true});
addEventListener('keydown',e=>{if(!stream)return;if(e.key==='ArrowLeft')turn(-6);if(e.key==='ArrowRight')turn(6)});
[['tl',-1],['tr',1]].forEach(([id,k])=>{const b=document.getElementById(id);let t;const go=()=>{turn(k*2.5);t=requestAnimationFrame(go)};b.addEventListener('pointerdown',e=>{e.stopPropagation();cancelAnimationFrame(t);go()});['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>cancelAnimationFrame(t)))});
</script></body></html>
